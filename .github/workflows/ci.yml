      - name: Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze mobile
        working-directory: mobile
        run: flutter analyze

      - name: Test mobile connection handling
        working-directory: mobile
        run: flutter test

      - name: Build Android APK
        working-directory: mobile
        shell: bash
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ODINVAULT_ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ODINVAULT_ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ODINVAULT_ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Android release build attempt $attempt/3"
            if flutter build apk --release; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              sleep_seconds=$((attempt * 15))
              echo "Build failed; retrying in ${sleep_seconds}s..."
              sleep "$sleep_seconds"
            fi
          done

          echo "Android release build failed after 3 attempts."
          exit 1

      - name: Validate final APK network permissions
        shell: bash
        run: |
          APKANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          "$APKANALYZER" manifest print mobile/build/app/outputs/flutter-apk/app-release.apk > mobile/release-manifest.xml
          python3 scripts/android_manifest.py validate mobile/release-manifest.xml

