      # raise SystemExit("Expected Flutter debug signing line was not found in build.gradle.kts")
      #
      # signing_config = '''
      # signingConfigs {
      # create("release") {
      # keyAlias = System.getenv("ANDROID_KEY_ALIAS")
      # keyPassword = System.getenv("ANDROID_KEY_PASSWORD")
      # storeFile = file("odinvault-release.jks")
      # storePassword = System.getenv("ANDROID_STORE_PASSWORD")
      # }
      # }
