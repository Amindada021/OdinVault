      - name: Read versions
        id: versions
        shell: bash
        run: |
          MANAGER_VERSION=$(python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("src/OdinVault.Manager.Wpf/OdinVault.Manager.Wpf.csproj").getroot()
          version = next((x.text for x in root.iter("Version") if x.text), None)
          if not version:
              raise SystemExit("Manager version not found")
          print(version)
          PY
          )
          MOBILE_VERSION=$(awk '/^version:/ {print $2}' mobile/pubspec.yaml | cut -d+ -f1)
          echo "manager_version=$MANAGER_VERSION" >> "$GITHUB_OUTPUT"
          echo "mobile_version=$MOBILE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare Android release files
        shell: bash
        run: |
          MOBILE_VERSION="${{ steps.versions.outputs.mobile_version }}"
          cp mobile/build/app/outputs/flutter-apk/app-release.apk "OdinVault-Mobile-v$MOBILE_VERSION.apk"
          sha256sum "OdinVault-Mobile-v$MOBILE_VERSION.apk" > "OdinVault-Mobile-v$MOBILE_VERSION.apk.sha256"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: OdinVault-Mobile-v${{ steps.versions.outputs.mobile_version }}
          path: |
            OdinVault-Mobile-v${{ steps.versions.outputs.mobile_version }}.apk
            OdinVault-Mobile-v${{ steps.versions.outputs.mobile_version }}.apk.sha256
          if-no-files-found: error
          retention-days: 30

  attach-android-mobile:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [android-mobile, windows-installer]
    runs-on: ubuntu-latest
    steps:
      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: OdinVault-Mobile-v${{ needs.android-mobile.outputs.mobile_version }}

      - name: Attach Android APK to OdinVault Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v${{ needs.android-mobile.outputs.manager_version }}"
          APK="OdinVault-Mobile-v${{ needs.android-mobile.outputs.mobile_version }}.apk"
          SUM="$APK.sha256"

          gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null
          gh release upload "$TAG" "$APK" "$SUM" --clobber --repo "${{ github.repository }}"

