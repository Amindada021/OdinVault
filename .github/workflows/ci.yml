name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore OdinVault.slnx

      - name: Build
        run: dotnet build OdinVault.slnx --configuration Release --no-restore

  windows-installer:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish self-contained Agent
        shell: pwsh
        run: dotnet publish src/OdinVault.Agent/OdinVault.Agent.csproj -c Release -r win-x64 --self-contained true -o artifacts/agent

      - name: Publish self-contained Manager
        shell: pwsh
        run: dotnet publish src/OdinVault.Manager/OdinVault.Manager.csproj -c Release -r win-x64 --self-contained true -o artifacts/manager

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Setup EXE
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\OdinVault.Agent.iss'

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: OdinVault-Setup
          path: installer/output/OdinVault-Setup.exe
          if-no-files-found: error
          retention-days: 14
