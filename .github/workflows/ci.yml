name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore OdinVault.slnx

      - name: Build
        run: dotnet build OdinVault.slnx --configuration Release --no-restore

  windows-installer:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Read application version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content "src/OdinVault.Manager.Wpf/OdinVault.Manager.Wpf.csproj"
          $version = [string]($project.Project.PropertyGroup.Version | Select-Object -First 1)
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Version was not found in OdinVault.Manager.csproj"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Publish self-contained Agent
        shell: pwsh
        run: dotnet publish src/OdinVault.Agent/OdinVault.Agent.csproj -c Release -r win-x64 --self-contained true -o artifacts/agent

      - name: Publish self-contained Manager
        shell: pwsh
        run: dotnet publish src/OdinVault.Manager.Wpf/OdinVault.Manager.Wpf.csproj -c Release -r win-x64 --self-contained true -o artifacts/manager

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Setup EXE
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" "installer\OdinVault.Agent.iss"

      - name: Create SHA256 checksum
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $installer = "installer/output/OdinVault-Setup-v$version.exe"
          $checksum = "$installer.sha256"
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  OdinVault-Setup-v$version.exe" | Set-Content -Path $checksum -Encoding ascii

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: OdinVault-Setup-v${{ steps.version.outputs.version }}
          path: |
            installer/output/OdinVault-Setup-v${{ steps.version.outputs.version }}.exe
            installer/output/OdinVault-Setup-v${{ steps.version.outputs.version }}.exe.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $tag = "v$version"
          gh release view $tag --repo "${{ github.repository }}" 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; skipping release creation."
            exit 0
          }

          gh release create $tag "installer/output/OdinVault-Setup-v$version.exe" "installer/output/OdinVault-Setup-v$version.exe.sha256" `
            --repo "${{ github.repository }}" `
            --target "${{ github.sha }}" `
            --title "OdinVault $tag" `
            --generate-notes


  android-mobile:
    if: github.event_name != 'pull_request'
    needs: [build]
    runs-on: ubuntu-latest
    outputs:
      manager_version: ${{ steps.versions.outputs.manager_version }}
      mobile_version: ${{ steps.versions.outputs.mobile_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Generate Android platform
        working-directory: mobile
        shell: bash
        run: |
          flutter create --platforms=android --org com.odinvault --project-name odinvault_mobile .
          rm -f test/widget_test.dart
          cp platform_templates/MainActivity.kt android/app/src/main/kotlin/com/odinvault/odinvault_mobile/MainActivity.kt
          cp -R platform_templates/res/* android/app/src/main/res/
          python3 ../scripts/android_manifest.py configure android/app/src/main/AndroidManifest.xml
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path("android/app/build.gradle.kts")
          gradle_text = gradle.read_text()
          gradle_text = gradle_text.replace(
              "compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }",
              "compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n        isCoreLibraryDesugaringEnabled = true\n    }"
          )
          if "coreLibraryDesugaring(" not in gradle_text:
              gradle_text = gradle_text.replace(
                  "}\n\nflutter {",
                  "}\n\ndependencies {\n    coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:2.1.5\")\n}\n\nflutter {"
              )
          gradle.write_text(gradle_text)
          PY

